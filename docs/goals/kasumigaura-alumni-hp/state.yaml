# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "霞ヶ浦高等学校同窓会 Webサイト(pasconet 超熟サイトのデザイン・アニメーション再現)"
  slug: "kasumigaura-alumni-hp"
  kind: specific # specific | open_ended | existing_plan | recovery | audit
  tranche: "継続実行: 参照サイト調査 → 技術選定 → セクション単位の縦割り実装と検証を繰り返し、最終監査で完了条件を満たすまで進める"
  status: done # active | blocked | done
  intake:
    original_request: "https://www.pasconet.co.jp/choujuku/ のデザインアニメーションを再現し、内容は霞ヶ浦高等学校同窓会用にして作成する"
    interpreted_outcome: "参照サイトのデザイン・アニメーションを再現し、全コンテンツを霞ヶ浦高等学校同窓会向けに置き換えた Next.js サイトが test-1 配下でビルド・起動・目視確認できる"
    input_shape: specific # vague | specific | existing_plan | recovery | audit
    audience: "霞ヶ浦高等学校同窓会の会員・卒業生・学校関係者"
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: demo # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "build 成功 + headless ブラウザでの PC/SP スクリーンショットで主要セクションとアニメーションの再現を確認 + 参照サイト固有名詞(pasco|パスコ|超熟|choujuku|敷島|食パン|レシピ|パン|supporter)の残存参照ゼロ"
    likely_misfire: "見た目だけコピーしてアニメーションを省略する / アニメーションだけ再現して文言がパン商品のまま・プレースホルダのまま / 参照サイトの画像・フォントを無断流用する / 参照サイトを塾サイトと誤認して構成を組む(訂正済)"
    blind_spots_considered:
      - "参照サイトの使用ライブラリは Swiper + 自社 azlib(anime.js + IntersectionObserver) + GSAP ScrollTrigger(パララックス 1 箇所)。Lenis 等は不使用(T001 で確定)"
      - "同窓会の実データ(役員名・会員数・行事・会費)は未提供。[要確認] プレースホルダで進め、docs/site-brief.md に差し替え一覧を残す"
      - "【訂正済】参照サイトは塾ではなく Pasco 食パン『超熟』ブランドサイト。MV/バナー帯/Concept/History/Recipe(Swiper)/CM Gallery/Supporter's Club/フッターを同窓会向けに再マッピング(notes/T002-judge-decision.md content_plan)"
      - "test-1 はホームディレクトリ全体が git ルート。git add はパス限定、破壊的 git 操作禁止"
      - "このホストでは Bash ヒアドキュメントに日本語を含めると失敗する。ファイル作成は Write/Edit ツールで行う"
    existing_plan_facts: []

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed
  worker: installed
  judge: installed

visual_board:
  # none | local | github_projects | both | unknown
  selected: local
  local:
    status: live # not_requested | starting | live | generated | blocked
    url: "http://goalbuddy.localhost:41737/kasumigaura-alumni-hp/"
    command: "npx goalbuddy board docs/goals/kasumigaura-alumni-hp"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "参照サイト https://www.pasconet.co.jp/choujuku/ の構造・デザイン・アニメーション・使用技術を調査し、再現仕様(セクション一覧・配色・タイポ・各アニメーションの挙動)を notes にまとめる。"
    inputs:
      - "https://www.pasconet.co.jp/choujuku/ (curl で HTML/CSS/JS 取得 + Playwright で PC/SP 観察)"
    constraints:
      - "Read-only。参照サイトの画像・フォント・文章をダウンロードして保存しない。"
    expected_output:
      - "セクション構成 / デザイントークン / アニメーション仕様 / 使用ライブラリ / 同窓会向け再マッピング案"
    receipt:
      result: done
      note: notes/T001-reference-site-analysis.md
      summary: "参照は Pasco 超熟ブランドサイト(塾ではない→チャーター訂正済)。10 ブロック、アニメ 17 種(intro fade 500ms / hover 連動 MV 0.5s / flowVox y60→0 600ms easeOutCubic stagger 300ms / ScrollTrigger scrub パララックス 1 箇所 / Swiper 4 種)。#005099・#F5F3EC、Yu Gothic + Montserrat 600、767px。ローディング演出は無し。"
      evidence:
        - notes/T001-reference-site-analysis.md
        - notes/T001-browser-observations.md
        - notes/ref/ref-pc-hero.png
        - notes/ref/ref-pc-full.jpg
        - notes/ref/ref-sp-hero.jpg
        - notes/ref/ref-sp-full.jpg
      deviations:
        - "Scout は Bash ヒアドキュメントで日本語 note を書けず(unexpected EOF)。本文を受領し PM が Write ツールで保存した。"
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "T001 の調査結果を検証し、技術スタックと Worker パッケージ(T003/T004/T005)を allowed_files / verify / stop_if 付きで確定する。"
    inputs:
      - "T001 receipt / notes/T001-*.md / notes/ref/*"
    constraints:
      - "Do not implement."
    expected_output:
      - "Decision / Worker packages / content plan"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      note: notes/T002-judge-decision.md
      rationale: "T001 の証拠は整合。スタック確定(Next.js App Router + TS + global CSS/CSS Modules 1rem=10px + Swiper 11 + GSAP は History parallax のみ + IntersectionObserver リビール + next/font Montserrat 600 + システム Yu Gothic)。§8 未解決(パン形マスク→角丸 40px、SNS/YouTube/バナーはデータ駆動で省略可、SVG プレースホルダ、Noto 不使用)を解決。T003/T004/T005 は逐次実行(src/** が重複するため並列禁止)。"
      parallel_safety: "T003, T004, T005 must run sequentially; no parallel Workers."
